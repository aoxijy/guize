name: Update Mihomo MRS and sing-box SRS rulesets

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lanjie.list'
      - 'zhilian.list'
      - 'Clash/MRS/sources/**'
      - 'scripts/update_mrs.py'
      - 'scripts/build_srs.py'
      - 'tests/test_build_srs.py'
      - '.github/workflows/update-mrs.yml'

permissions:
  contents: write

jobs:
  update-mrs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mihomo
        shell: bash
        run: |
          set -euo pipefail
          version="v1.19.30"
          url="https://github.com/MetaCubeX/mihomo/releases/download/${version}/mihomo-linux-amd64-${version}.gz"
          curl -L --retry 5 --retry-delay 3 -o /tmp/mihomo.gz "$url"
          gzip -df /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v

      - name: Download sing-box
        shell: bash
        run: |
          set -euo pipefail
          version="1.14.4"
          url="https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-amd64.tar.gz"
          curl -fL --retry 5 --retry-delay 3 -o /tmp/sing-box.tar.gz "$url"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          install -m 755 "/tmp/sing-box-${version}-linux-amd64/sing-box" /tmp/sing-box
          /tmp/sing-box version

      - name: Test SRS conversion semantics
        run: python3 -m unittest discover -s tests -p 'test_build_srs.py'

      - name: Update and compile MRS
        run: python3 scripts/update_mrs.py --mihomo /tmp/mihomo

      - name: Compile and verify SRS from the same MRS artifacts
        run: python3 scripts/build_srs.py --mihomo /tmp/mihomo --sing-box /tmp/sing-box

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp Clash/MRS/*.mrs dist/
          cp SingBox/SRS/*.srs dist/
          cp SingBox/SRS/summary-srs.json dist/
          cp Clash/MRS/summary.json dist/
          cp Clash/MRS/README.md dist/
          {
            echo "# Mihomo MRS and sing-box SRS rulesets"
            echo
            echo "Both formats are generated in the same run. SRS files are decoded from the corresponding MRS artifacts and verified by a compile/decompile round trip."
            echo
            echo "## Stable download URLs"
            echo
            for f in dist/*.mrs dist/*.srs; do
              name="$(basename "$f")"
              echo "- ${name}: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${name}"
            done
            echo
            echo "## Summary"
            echo
            echo '```json'
            cat Clash/MRS/summary.json
            echo '```'
          } > dist/RELEASE_NOTES.md

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git add Clash/MRS SingBox/SRS
          if git diff --cached --quiet -- Clash/MRS SingBox/SRS; then
            echo "No MRS or SRS changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Mihomo MRS and sing-box SRS rulesets"
          git push

      - name: Publish latest MRS and SRS release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mrs-latest
          name: Latest Mihomo MRS and sing-box SRS rulesets
          body_path: dist/RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: |
            dist/*.mrs
            dist/*.srs
            dist/summary-srs.json
            dist/summary.json
            dist/README.md
