name: Update Mihomo MRS rulesets

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lanjie.list'
      - 'zhilian.list'
      - 'Clash/MRS/sources/**'
      - 'scripts/update_mrs.py'
      - '.github/workflows/update-mrs.yml'

permissions:
  contents: write

jobs:
  update-mrs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mihomo
        shell: bash
        run: |
          set -euo pipefail
          version="v1.19.30"
          url="https://github.com/MetaCubeX/mihomo/releases/download/${version}/mihomo-linux-amd64-${version}.gz"
          curl -L --retry 5 --retry-delay 3 -o /tmp/mihomo.gz "$url"
          gzip -df /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v

      - name: Update and compile MRS
        run: python3 scripts/update_mrs.py --mihomo /tmp/mihomo

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp Clash/MRS/*.mrs dist/
          cp Clash/MRS/summary.json dist/
          cp Clash/MRS/README.md dist/
          {
            echo "# Mihomo MRS rulesets"
            echo
            echo "This release is generated automatically from upstream rule sources."
            echo
            echo "## Stable download URLs"
            echo
            for f in dist/*.mrs; do
              name="$(basename "$f")"
              echo "- ${name}: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${name}"
            done
            echo
            echo "## Summary"
            echo
            echo '```json'
            cat Clash/MRS/summary.json
            echo '```'
          } > dist/RELEASE_NOTES.md

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Clash/MRS; then
            echo "No MRS changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Clash/MRS
          git commit -m "Update Mihomo MRS rulesets"
          git push

      - name: Publish latest MRS release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mrs-latest
          name: Latest Mihomo MRS rulesets
          body_path: dist/RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: |
            dist/*.mrs
            dist/summary.json
            dist/README.md
